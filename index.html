<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="A responsive web page">
		<title>AD-Digital</title>
		<style>
			:root {
				color-scheme: light;
				font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
				line-height: 1.5;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				background: #f5f7fa;
				color: #1f2937;
			}

			main {
				width: min(100% - 2rem, 70rem);
				margin: 0 auto;
				padding: 3rem 0;
			}

			h1 {
				margin-top: 0;
				font-size: clamp(1.75rem, 5vw, 3rem);
                text-align: center;
			}

			p {
				max-width: 65ch;
			}

			@media (max-width: 480px) {
				main {
					width: min(100% - 1.5rem, 70rem);
					padding: 2rem 0;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Welcome to AD-Digital</h1>
            <hr>
			<p>AD-Digital Page was under Construction.</p>
            <p>For Inquiry and other Concerns message <a href="mailto:admin@ad-digital.site">admin@ad-digital.site</a></p>
            <hr>
		</main>
	</body>
</html>
